<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>車旅所 | 機場接送・商務接送</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
    .pac-container { z-index: 99999 !important; border-radius: 12px; overflow: hidden; border: 1px solid #334155; box-shadow: 0 18px 45px rgba(0,0,0,.35); }

    :root {
      color-scheme: dark;
      --ink: #101613;
      --forest: #151e1a;
      --panel: #1b2620;
      --panel-raised: #222f28;
      --line: rgba(211, 190, 145, .17);
      --muted: #a2aaa2;
      --ivory: #f3efe5;
      --champagne: #c8ad75;
      --champagne-bright: #dfc993;
      --focus: rgba(200, 173, 117, .3);
    }
    html { scroll-padding-top: 5.5rem; }
    body {
      background: var(--ink) !important;
      color: var(--ivory);
      font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      letter-spacing: .01em;
    }
    header {
      background: rgba(16, 22, 19, .92) !important;
      border-color: var(--line) !important;
      box-shadow: 0 8px 28px rgba(0,0,0,.16);
    }
    header > div { min-height: 4.5rem; }
    header a { transition: color .2s ease; }
    .bg-slate-950 { background-color: var(--ink) !important; }
    .bg-slate-900 { background-color: var(--forest) !important; }
    .bg-slate-800 { background-color: var(--panel-raised) !important; }
    .bg-slate-800\/80 { background-color: rgba(27,38,32,.88) !important; }
    .bg-slate-800\/60 { background-color: rgba(34,47,40,.68) !important; }
    .bg-slate-900\/70 { background-color: rgba(21,30,26,.76) !important; }
    .bg-slate-950\/60 { background-color: rgba(12,17,14,.62) !important; }
    .bg-slate-950\/30 { background-color: rgba(12,17,14,.32) !important; }
    .border-slate-800, .border-slate-700, .border-slate-700\/50,
    .border-slate-800\/50, .border-slate-600 { border-color: var(--line) !important; }
    .text-slate-100, .text-slate-200 { color: #ebe8df !important; }
    .text-slate-300 { color: #c5c8bf !important; }
    .text-slate-400, .text-slate-500 { color: var(--muted) !important; }
    .text-white { color: #f7f4ec !important; }
    .text-amber-400, .text-amber-500 { color: var(--champagne-bright) !important; }
    .text-amber-100\/80 { color: #dfd2b4 !important; }
    .bg-amber-500 {
      background-color: var(--champagne) !important;
      color: #182019 !important;
    }
    .hover\:bg-amber-400:hover { background-color: var(--champagne-bright) !important; }
    .border-amber-500, .border-amber-500\/20 { border-color: rgba(200,173,117,.58) !important; }
    .bg-amber-500\/10, .bg-amber-500\/5 { background-color: rgba(200,173,117,.1) !important; }
    .from-amber-400 { --tw-gradient-from: #dfc993 var(--tw-gradient-from-position) !important; }
    .to-amber-600 { --tw-gradient-to: #a88953 var(--tw-gradient-to-position) !important; }
    .from-blue-300 { --tw-gradient-from: #dfc993 var(--tw-gradient-from-position) !important; }
    .to-amber-500 { --tw-gradient-to: #a88953 var(--tw-gradient-to-position) !important; }
    .bg-emerald-500 { background-color: var(--champagne) !important; color: #172019 !important; }
    .hover\:bg-emerald-400:hover { background-color: var(--champagne-bright) !important; }
    .text-emerald-300, .text-emerald-400 { color: #d8c18d !important; }
    .bg-emerald-500\/10 { background-color: rgba(200,173,117,.1) !important; }
    .text-emerald-400 { color: var(--champagne-bright) !important; }
    .bg-blue-500\/10 { background-color: rgba(200,173,117,.1) !important; }
    .text-blue-300 { color: var(--champagne-bright) !important; }
    .border-blue-500\/20, .border-blue-500\/30 { border-color: rgba(200,173,117,.38) !important; }
    main > section:first-child {
      min-height: min(820px, calc(100svh - 4.5rem));
      background:
        radial-gradient(ellipse at 50% 4%, rgba(200,173,117,.09), transparent 42%),
        linear-gradient(180deg, #121a16 0%, #101613 100%) !important;
    }
    main > section:first-child > .absolute:first-child {
      opacity: .12;
      background-image: radial-gradient(rgba(200,173,117,.42) .7px, transparent .7px) !important;
      background-size: 24px 24px !important;
    }
    main > section:first-child > div.relative { gap: 2rem; }
    h1 { letter-spacing: .045em !important; line-height: 1.25 !important; }
    main > section:first-child h1 { text-wrap: balance; }
    main > section:first-child p { line-height: 1.9; }
    .tab-button {
      min-height: 132px;
      border-radius: 18px !important;
      border-color: var(--line) !important;
      background: rgba(27,38,32,.58) !important;
      transition: transform .22s ease, background .22s ease, border-color .22s ease, box-shadow .22s ease !important;
    }
    .tab-button:hover { transform: translateY(-2px); border-color: rgba(200,173,117,.5) !important; }
    .tab-button.active-tab {
      background: linear-gradient(145deg, rgba(200,173,117,.16), rgba(27,38,32,.94)) !important;
      border-color: var(--champagne) !important;
      box-shadow: 0 12px 34px rgba(0,0,0,.2), inset 0 0 0 1px rgba(200,173,117,.12) !important;
    }
    .tab-icon { border: 1px solid rgba(200,173,117,.14); }
    #bookingForm > div, #bookingForm label { transition: border-color .2s ease, background .2s ease; }
    input:not([type="checkbox"]), select {
      min-height: 48px;
      background-color: rgba(12,17,14,.7) !important;
      border-color: var(--line) !important;
      border-radius: 12px !important;
      color: #f0ede5 !important;
      color-scheme: dark;
    }
    input::placeholder { color: #818b82 !important; }
    input:not([type="checkbox"]):focus, select:focus {
      border-color: var(--champagne) !important;
      box-shadow: 0 0 0 3px var(--focus) !important;
      outline: none !important;
    }
    input[type="checkbox"] { accent-color: var(--champagne); width: 17px; height: 17px; }
    button { -webkit-tap-highlight-color: transparent; }
    #searchSourceButton, #searchDestButton {
      border-radius: 12px !important;
      background: #29372f !important;
      border-color: rgba(200,173,117,.22) !important;
    }
    #quoteButton {
      min-height: 56px;
      border-radius: 14px !important;
      box-shadow: 0 10px 28px rgba(200,173,117,.13) !important;
      letter-spacing: .04em;
    }
    #quoteButton:hover { transform: translateY(-1px); box-shadow: 0 14px 34px rgba(200,173,117,.2) !important; }
    #sourceResults, #destResults, .pac-container {
      background: #17211b !important;
      border-color: var(--line) !important;
      border-radius: 14px !important;
      box-shadow: 0 20px 55px rgba(0,0,0,.38) !important;
    }
    #sourceResults button:hover, #destResults button:hover { background: #26342c !important; }
    #advantages, #services, #fleet {
      border-color: var(--line) !important;
      background-color: #121a16 !important;
    }
    #advantages > div > div, #fleet > div > div {
      border-color: var(--line) !important;
      background: linear-gradient(150deg, rgba(34,47,40,.9), rgba(23,32,27,.92)) !important;
      border-radius: 18px !important;
      box-shadow: 0 12px 30px rgba(0,0,0,.12);
      transition: transform .22s ease, border-color .22s ease;
    }
    #advantages > div > div:hover, #fleet > div > div:hover {
      transform: translateY(-3px); border-color: rgba(200,173,117,.35) !important;
    }
    #quoteModal { background-color: rgba(6,10,8,.78) !important; }
    #quoteModal > div {
      background: #19231d !important;
      border-color: rgba(200,173,117,.26) !important;
      border-radius: 22px !important;
      box-shadow: 0 28px 90px rgba(0,0,0,.55) !important;
    }
    #resultPrice { color: var(--champagne-bright) !important; }
    #resultMaps { text-underline-offset: 4px; }
    #backButton { border-color: var(--line) !important; border-radius: 12px !important; }
    #confirmButton {
      background: var(--champagne) !important;
      color: #172019 !important;
      border-radius: 12px !important;
    }
    :focus-visible { outline: 2px solid var(--champagne-bright) !important; outline-offset: 3px; }
    @media (max-width: 640px) {
      header > div { min-height: 4rem; }
      main > section:first-child { min-height: auto; padding-top: 2.25rem; padding-bottom: 3rem; }
      main > section:first-child > div.relative { gap: 1.5rem; }
      main > section:first-child h1 { font-size: clamp(1.8rem, 8vw, 2.5rem); }
      .tab-button { min-height: 112px; padding: .8rem !important; }
      #bookingForm > .grid { gap: 1rem; }
      #quoteModal { align-items: flex-end !important; padding: 0 !important; }
      #quoteModal > div { max-height: 92svh; overflow-y: auto; border-radius: 22px 22px 0 0 !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }

  </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased">
  <header class="sticky top-0 z-50 bg-slate-950/90 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between">
      <a href="./index.html" class="flex items-center gap-2">
        <span class="text-xl sm:text-2xl font-bold tracking-widest text-white">車旅所<span class="text-amber-500">.</span></span>
        <span class="hidden sm:inline-block px-2.5 py-0.5 text-xs font-semibold bg-blue-500/10 text-blue-300 border border-blue-500/20 rounded-full">機場接送</span>
      </a>
      <a href="./index.html" class="text-sm text-slate-300 hover:text-amber-400">返回首頁</a>
    </div>
  </header>

  <main>
    <section class="relative min-h-[85vh] flex items-center justify-center py-8 sm:py-12 px-4 sm:px-6 lg:px-8 bg-slate-950 overflow-hidden">
      <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#d97706_1px,transparent_1px)] [background-size:16px_16px]"></div>
      <div class="relative max-w-5xl w-full flex flex-col items-center gap-6 sm:gap-8">
        <div class="text-center">
          <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight text-white mb-2 sm:mb-4 px-2">
            機場接送 尊榮安排 <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-300 to-amber-500">車旅所</span>
          </h1>
          <p class="text-sm sm:text-base text-slate-400 max-w-3xl mx-auto px-4 leading-relaxed">
            輸入上車地點、選擇機場與車型，查看您的預估車資。
          </p>
        </div>

        <div id="serverPanel" class="w-full bg-slate-800/80 border border-blue-500/30 rounded-2xl p-5 sm:p-6 shadow-2xl">
          <label class="block text-sm sm:text-base font-bold text-slate-300 mb-2">行程小提醒</label>
          <p id="serverStatus" class="text-sm text-emerald-300">請先搜尋並選好上車地點，再查看預估車資。</p>
        </div>

        <div class="w-full bg-slate-800/80 border border-slate-700/50 rounded-2xl shadow-2xl backdrop-blur-md overflow-visible">
          <div class="p-5 sm:p-8">
            <form id="bookingForm" class="space-y-5 sm:space-y-6">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">
                <div>
                  <label class="block text-sm sm:text-base font-bold text-slate-300 mb-1.5 sm:mb-2">出發地址</label>
                  <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="txtSource" placeholder="例：台北市內湖區麗山街63號、麗山國中" autocomplete="off" class="flex-1 min-w-0 bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-3 text-base text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/50 transition-all" />
                    <button id="searchSourceButton" type="button" class="px-5 py-3 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded-lg text-sm font-bold text-slate-100 transition-all">搜尋地點</button>
                  </div>
                  <p id="sourceStatus" class="text-xs text-slate-500 mt-2">請先搜尋並選擇地點。</p>
                  <div id="sourceResults" class="hidden mt-3 bg-slate-950 border border-slate-700 rounded-xl overflow-hidden divide-y divide-slate-800 max-h-64 overflow-y-auto"></div>
                </div>
                <div>
                  <label class="block text-sm sm:text-base font-bold text-slate-300 mb-1.5 sm:mb-2">抵達機場</label>
                  <select id="airportDest" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-3 text-base text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500/50 transition-all"></select>
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-12 gap-5 sm:gap-6">
                <div class="md:col-span-7">
                  <label class="block text-sm sm:text-base font-bold text-slate-300 mb-1.5 sm:mb-2">乘車日期與時間</label>
                  <div class="grid grid-cols-3 gap-2">
                    <input type="date" id="rideDate" required class="col-span-3 sm:col-span-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-3 text-base text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500/50" />
                    <select id="rideHour" required class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-3 text-base text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500/50"></select>
                    <select id="rideMinute" required class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-3 text-base text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500/50"></select>
                  </div>
                </div>
                <div class="md:col-span-5">
                  <label class="block text-sm sm:text-base font-bold text-slate-300 mb-1.5 sm:mb-2">選擇車型</label>
                  <select id="vehicleType" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-3 text-base text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500/50">
                    <option value="comfort_4">舒適四人座</option>
                    <option value="luxury_import">尊榮進口車 +500</option>
                    <option value="business_7">七人座商旅 +300</option>
                    <option value="premium_7">七人座尊爵 +2000</option>
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <label class="flex items-center gap-3 bg-slate-900/70 border border-slate-700 rounded-lg px-4 py-3 text-sm text-slate-300">
                  <input type="checkbox" id="addonSign" class="accent-amber-500" />
                  <span>舉牌服務 +200</span>
                </label>
                <label class="flex items-center gap-3 bg-slate-900/70 border border-slate-700 rounded-lg px-4 py-3 text-sm text-slate-300">
                  <input type="checkbox" id="addonSeat" class="accent-amber-500" />
                  <span>兒童安全座椅 +300</span>
                </label>
              </div>

              <button id="quoteButton" type="submit" class="w-full py-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-lg rounded-xl shadow-lg shadow-amber-900/20 transition-all flex items-center justify-center gap-2">
                <i data-lucide="calculator" class="w-5 h-5"></i>
                <span>試算車資</span>
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="quoteModal" class="hidden fixed inset-0 z-[100] items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
    <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden">
      <div class="p-5 sm:p-6 space-y-5">
        <div class="text-center relative">
          <button id="closeModal" type="button" class="absolute right-0 top-0 text-slate-500 hover:text-slate-200"><i data-lucide="x" class="w-5 h-5"></i></button>
          <h3 class="text-xl sm:text-2xl font-extrabold text-white">車資試算結果</h3>
        </div>
        <div class="bg-slate-950/60 border border-slate-800 p-4 rounded-xl space-y-2.5 text-sm">
          <p><span class="text-slate-400">起點：</span><span id="resultSource" class="text-white font-semibold"></span></p>
          <p><span class="text-slate-400">目的地：</span><span id="resultDest" class="text-white font-semibold"></span></p>
          <p><span class="text-slate-400">預估路程：</span><span id="resultDistance" class="text-amber-400 font-bold"></span></p>
          <p><span class="text-slate-400">預估車程：</span><span id="resultDuration" class="text-slate-200"></span></p>
          <p><span class="text-slate-400">費用說明：</span><span id="resultMethod" class="text-slate-200"></span></p>
          <p class="text-xs text-slate-400">依目前路況估算，非預約時間的路況；實際路線可能隨路況調整。</p>
          <a id="resultMaps" target="_blank" rel="noopener noreferrer" class="inline-block text-amber-400 underline">在 Google Maps 查看汽車路線</a>
        </div>
        <div class="bg-amber-500/5 border border-amber-500/20 py-4 px-6 rounded-xl text-center">
          <p class="text-xs text-amber-500/80 uppercase font-semibold tracking-wider">預估總費用</p>
          <p id="resultPrice" class="text-4xl font-black text-amber-400 mt-1">NT$ --</p>
        </div>
        <button id="backButton" type="button" class="w-full py-3 border border-slate-700 text-slate-300 font-semibold rounded-lg hover:bg-slate-800 transition-all text-sm">返回修改</button>
      </div>
    </div>
  </div>

  <script>
    const airports = [
      { code: 'TPE', text: '台灣桃園國際機場 (TPE)', address: '33758桃園市大園區三石里航站南路9號' },
      { code: 'TSA', text: '台北松山機場 (TSA)', lat: 25.0697, lng: 121.5518 },
      { code: 'RMQ', text: '台中清泉崗機場 (RMQ)', lat: 24.2636, lng: 120.6206 },
      { code: 'KHH', text: '高雄小港國際機場 (KHH)', lat: 22.5768, lng: 120.3500 }
    ];

    const $ = (id) => document.getElementById(id);
    let selectedSourcePlace = null;
    let sourceComposing = false;

    function initSelects() {
      for (const airport of airports) $('airportDest').appendChild(new Option(airport.text, airport.code));
      for (let i = 0; i < 24; i++) $('rideHour').appendChild(new Option(String(i).padStart(2, '0') + ' 時', String(i).padStart(2, '0')));
      for (const m of ['00', '15', '30', '45']) $('rideMinute').appendChild(new Option(m + ' 分', m));
      const today = new Date().toISOString().slice(0, 10);
      $('rideDate').min = today;
      $('rideDate').value = today;
    }

    function setServerStatus(message, className = 'text-sm text-emerald-300') {
      $('serverStatus').innerText = message;
      $('serverStatus').className = className;
    }

    function setSourceStatus(message, className = 'text-xs text-slate-500 mt-2') {
      $('sourceStatus').innerText = message;
      $('sourceStatus').className = className;
    }

    function setQuoteEnabled(enabled) {
      const button = $('quoteButton');
      button.disabled = !enabled;
      button.classList.toggle('opacity-60', !enabled);
      button.classList.toggle('cursor-not-allowed', !enabled);
    }

    async function apiPost(path, payload) {
      const response = await fetch(path, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(payload),
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.error || `API request failed: ${response.status}`);
      }
      return data;
    }

    function renderCandidates(candidates) {
      const results = $('sourceResults');
      results.innerHTML = '';

      if (!candidates.length) {
        results.classList.add('hidden');
        setSourceStatus('找不到地點，請輸入更完整地址。', 'text-xs text-red-400 mt-2');
        return;
      }

      for (const candidate of candidates) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'w-full text-left px-4 py-3 hover:bg-slate-800 transition-colors';

        const name = document.createElement('p');
        name.className = 'text-sm font-bold text-slate-100';
        name.textContent = candidate.name || candidate.address;

        const address = document.createElement('p');
        address.className = 'text-xs text-slate-400 mt-1';
        address.textContent = candidate.address;

        button.append(name, address);
        button.addEventListener('click', () => selectSourceCandidate(candidate));
        results.appendChild(button);
      }

      results.classList.remove('hidden');
      setSourceStatus('請從地點中選擇一筆。', 'text-xs text-amber-400 mt-2');
    }

    function selectSourceCandidate(candidate) {
      selectedSourcePlace = candidate;
      $('txtSource').value = candidate.address || candidate.name;
      $('sourceResults').classList.add('hidden');
      $('sourceResults').innerHTML = '';
      setSourceStatus('已選擇地點，可以試算。', 'text-xs text-emerald-400 mt-2');
      setQuoteEnabled(true);
    }

    async function searchSource() {
      const query = $('txtSource').value.trim();
      if (query.length < 2) {
        setSourceStatus('請輸入至少 2 個字的地點或地址。', 'text-xs text-red-400 mt-2');
        return;
      }

      selectedSourcePlace = null;
      setQuoteEnabled(false);
      const button = $('searchSourceButton');
      const originalText = button.innerText;
      button.disabled = true;
      button.innerText = '搜尋中...';
      setSourceStatus('正在搜尋地點...', 'text-xs text-slate-400 mt-2');

      try {
        const data = await apiPost('/api/places/search', { query });
        renderCandidates(data.candidates || []);
        setServerStatus('地點搜尋完成，請確認上車地址。', 'text-sm text-emerald-300');
      } catch (error) {
        $('sourceResults').classList.add('hidden');
        setSourceStatus('暫時無法搜尋地點，請稍後再試。', 'text-xs text-red-400 mt-2');
        setServerStatus('暫時無法搜尋地點，請稍後再試。', 'text-sm text-red-300');
      } finally {
        button.disabled = false;
        button.innerText = originalText;
      }
    }

    function formatDuration(duration) {
      const seconds = Number(String(duration || '').replace('s', ''));
      if (!Number.isFinite(seconds) || seconds <= 0) return '需人工確認';
      const minutes = Math.round(seconds / 60);
      if (minutes < 60) return `${minutes} 分鐘`;
      const hours = Math.floor(minutes / 60);
      const rest = minutes % 60;
      return rest ? `${hours} 小時 ${rest} 分鐘` : `${hours} 小時`;
    }

    async function handleQuote(event) {
      event.preventDefault();
      if (!selectedSourcePlace) {
        setSourceStatus('請先搜尋並選擇地點。', 'text-xs text-red-400 mt-2');
        return;
      }

      const button = $('quoteButton');
      const originalText = button.innerHTML;
      button.disabled = true;
      button.innerHTML = '<span class="animate-spin rounded-full h-5 w-5 border-2 border-slate-950 border-t-transparent"></span><span>正在試算車資...</span>';

      try {
        const quote = await apiPost('/api/quote', {
          origin: selectedSourcePlace,
          destinationAirportCode: $('airportDest').value,
          vehicleType: $('vehicleType').value,
          addons: {
            sign: $('addonSign').checked,
            childSeat: $('addonSeat').checked
          }
        });

        $('resultSource').innerText = quote.origin?.address || quote.origin?.name || selectedSourcePlace.address;
        $('resultDest').innerText = quote.destination?.address ? quote.destination.text + '｜' + quote.destination.address : (quote.destination?.text || $('airportDest').selectedOptions[0].text);
        $('resultDistance').innerText = `${Number(quote.distanceKm).toFixed(1)} 公里`;
        $('resultMaps').href = quote.mapsUrl;
        $('resultDuration').innerText = formatDuration(quote.duration);
        $('resultMethod').innerText = quote.pricingMethod;
        $('resultPrice').innerText = `NT$ ${Number(quote.totalPrice).toLocaleString()}`;
        $('quoteModal').classList.remove('hidden');
        $('quoteModal').classList.add('flex');
        setServerStatus('車資試算完成，實際費用與預約請洽客服確認。', 'text-sm text-emerald-300');
      } catch (error) {
        setSourceStatus('暫時無法試算車資，請稍後再試或洽客服確認。', 'text-xs text-red-400 mt-2');
        setServerStatus('暫時無法提供車資，請洽客服確認。', 'text-sm text-red-300');
      } finally {
        button.disabled = false;
        button.innerHTML = originalText;
        lucide.createIcons();
      }
    }

    function closeQuoteModal() {
      $('quoteModal').classList.add('hidden');
      $('quoteModal').classList.remove('flex');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initSelects();
      setQuoteEnabled(false);
      $('bookingForm').addEventListener('submit', handleQuote);
      $('closeModal').addEventListener('click', closeQuoteModal);
      $('backButton').addEventListener('click', closeQuoteModal);
      $('searchSourceButton').addEventListener('click', searchSource);
      $('txtSource').addEventListener('compositionstart', () => {
        sourceComposing = true;
      });
      $('txtSource').addEventListener('compositionend', () => {
        sourceComposing = false;
        selectedSourcePlace = null;
        setQuoteEnabled(false);
        setSourceStatus('地址已修改，請重新搜尋地點。', 'text-xs text-amber-400 mt-2');
      });
      $('txtSource').addEventListener('input', () => {
        if (sourceComposing) return;
        selectedSourcePlace = null;
        setQuoteEnabled(false);
        $('sourceResults').classList.add('hidden');
        setSourceStatus('地址已修改，請重新搜尋地點。', 'text-xs text-amber-400 mt-2');
      });
      $('txtSource').addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !sourceComposing) {
          event.preventDefault();
          searchSource();
        }
      });
      lucide.createIcons();
    });
  </script>
</body>
</html>
